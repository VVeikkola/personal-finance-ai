[project]
name = "personal-finance-ai"
version = "0.1.0"
description = "Privacy-first personal finance AI backend"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.1",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "alembic==1.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]